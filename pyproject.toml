[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_sandbox_run"
version = "0.1.1"
description = "explicit command isolation runner"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jonah Helland"}]
dependencies = []

[project.scripts]
agent-sandbox = "agent_sandbox_run.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
